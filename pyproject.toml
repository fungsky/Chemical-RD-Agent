[project]
name = "chem-ai-agent"
version = "0.1.0"
description = "ChemAgent - 化工研发智能体：基于知识图谱和生成式AI的化工配方智能开发平台"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Web 框架
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",

    # 数据模型
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Neo4j 图数据库
    "neo4j>=5.14.0",

    # LangChain + Ollama
    "langchain>=0.1.0",
    "langchain-ollama>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.1.0",

    # ML 预测
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",

    # 前端
    "streamlit>=1.29.0",
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "plotly>=5.18.0",

    # 认证
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1.0",

    # 知识库
    "chromadb>=0.4.22",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "langchain-text-splitters>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
