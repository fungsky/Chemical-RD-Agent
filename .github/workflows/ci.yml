name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install -e .

      - name: Syntax check
        run: python -m compileall chem_agent/ tests/ -q

      - name: Run tests
        env:
          CHEM_AUTH_DB_BACKEND: sqlite
          CHEM_AUTH_DB_PATH: ./test_auth.db
        run: python -m pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t chemagent:ci-test .

      - name: Verify image
        run: |
          docker run --rm chemagent:ci-test python -c "from chem_agent.config import settings; print('Image OK:', settings.app_name)"